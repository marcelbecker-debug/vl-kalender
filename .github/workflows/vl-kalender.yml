name: VL-Kalender

on:
  schedule:
    - cron: "17 4 * * 1"   # montags 04:17 UTC (06:17 Sommerzeit / 05:17 Winterzeit)
  workflow_dispatch:        # "Run workflow" von Hand

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Programm lesen, vl.ics bauen und pruefen
        run: python3 vl_ics.py docs/vl.ics
      - name: Einchecken
        run: |
          git config user.name "vl-kalender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vl.ics
          git diff --cached --quiet || git commit -m "VL-Kalender $(date -u +%F)"
          git push
